<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input - Computer Arithmetic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: Inter, 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        .card {
            width: min(100%, 980px);
            background: #090a0f;
            border: 1px solid #2c2e3a;
            border-radius: 14px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, .7);
            padding: 24px;
            margin-top: 18px;
        }
        
        .header {
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: #e2e8f0;
            font-size: 2rem;
            font-weight: 900;
        }
        
        .header p {
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 700;
        }
        
        .input-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            margin-bottom: 16px;
        }
        
        .form-label {
            font-size: .85rem;
            font-weight: 800;
            color: #f8fafc;
            margin-bottom: 6px;
        }
        
        .form-input {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f8fafc;
            padding: 11px 12px;
            font-size: 1rem;
        }
        
        .form-input:focus {
            outline: 1px solid #38bdf8;
            border-color: #38bdf8;
        }
        
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .btn {
            border: none;
            border-radius: 11px;
            padding: 11px 16px;
            font-weight: 900;
            cursor: pointer;
        }
        
        .btn-primary {
            background: #22c55e;
            color: #000;
        }
        
        .btn-secondary {
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
        }
        
        .result-summary {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }
        
        .chip {
            background: #111827;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            min-width: 115px;
        }
        
        .chip .name {
            font-size: .71rem;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 700;
        }
        
        .chip .value {
            margin-top: 3px;
            font-family: 'Courier New', monospace;
            font-size: .92rem;
            color: #eeeeee;
            word-break: break-all;
        }
        
        .step-box {
            background: #0b1120;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            margin: 9px 0;
        }
        
        .step-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 7px;
        }
        
        .step-title {
            color: #f8fafc;
            font-weight: 900;
            font-size: .92rem;
        }
        
        .step-op {
            color: #38bdf8;
            font-size: .82rem;
            font-weight: 800;
        }
        
        .field-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
        }
        
        .field-name {
            color: #94a3b8;
            font-size: .74rem;
            font-weight: 800;
        }
        
        .field-value {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            padding: 7px;
            font-family: 'Courier New', monospace;
            font-size: .82rem;
        }
        
        .footer {
            margin-top: 12px;
            text-align: center;
            color: #94a3b8;
            font-size: .82rem;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>Enter Input</h1>
            <p id="sub">Choose an operator and enter binary values.</p>
        </div>

        <div class="input-grid">
            <div>
                <div class="form-label" id="label1">Input 1</div>
                <input id="input1" class="form-input" placeholder="e.g., 0111" />
            </div>
            <div>
                <div class="form-label" id="label2">Input 2</div>
                <input id="input2" class="form-input" placeholder="e.g., 0101" />
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="calcBtn" onclick="calculate()">Calculate</button>
            <button class="btn btn-secondary" onclick="resetForm()">Reset</button>
            <button class="btn btn-secondary" onclick="back()">Back</button>
        </div>

        <div id="summary" class="result-summary"></div>
        <div id="steps"></div>

        <div class="footer">Made by yug patel</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const op = params.get('op');
        const ops = {
            booth: ['Booth Multiplication', 'Multiplicand', 'Multiplier'],
            modified_booth: ['Modified Booth', 'Multiplicand', 'Multiplier'],
            restoring: ['Restoring Division', 'Dividend', 'Divisor'],
            non_restoring: ['Non-Restoring Division', 'Dividend', 'Divisor']
        };

        if (ops[op]) {
            const [title, label1, label2] = ops[op];
            document.querySelector('h1').textContent = title;
            document.getElementById('sub').textContent = 'Binary algorithm steps for ' + title + '.';
            document.getElementById('label1').textContent = label1;
            document.getElementById('label2').textContent = label2;
        } else {
            document.querySelector('h1').textContent = 'Unknown operation';
            document.getElementById('sub').textContent = 'Use the home page to select a valid operation.';
            document.getElementById('calcBtn').disabled = true;
        }

        function isBinary(v) {
            return /^[01]+$/.test(v.trim());
        }

        function resetForm() {
            document.getElementById('input1').value = '';
            document.getElementById('input2').value = '';
            document.getElementById('summary').innerHTML = '';
            document.getElementById('steps').innerHTML = '';
        }

        function back() {
            window.location.href = 'index.html';
        }

        function calculate() {
            const a = document.getElementById('input1').value.trim();
            const b = document.getElementById('input2').value.trim();
            if (!isBinary(a) || !isBinary(b)) {
                alert('Use binary digits only.');
                return;
            }
            if ((op === 'booth' || op === 'modified_booth') && a.length !== b.length) {
                alert('Multiplication inputs must be same length.');
                return;
            }
            document.getElementById('calcBtn').disabled = true;
            fetch('http://localhost:5000/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(op === 'booth' || op === 'modified_booth' ? {
                        operation: op,
                        m: a,
                        q: b
                    } : {
                        operation: op,
                        dividend: a,
                        divisor: b
                    })
                })
                .then(r => r.json())
                .then(data => {
                    document.getElementById('calcBtn').disabled = false;
                    const summary = document.getElementById('summary');
                    summary.innerHTML = '';
                    if (data.result) summary.innerHTML += `<div class="chip"><div class="name">Result</div><div class="value">${data.result}</div></div>`;
                    if (data.quotient) summary.innerHTML += `<div class="chip"><div class="name">Quotient</div><div class="value">${data.quotient}</div></div>`;
                    if (data.remainder !== undefined) summary.innerHTML += `<div class="chip"><div class="name">Remainder</div><div class="value">${data.remainder}</div></div>`;
                    const s = document.getElementById('steps');
                    s.innerHTML = '';
                    (data.steps || []).forEach((step, i) => {
                        const box = document.createElement('div');
                        box.className = 'step-box';
                        const opText = (step.operation || '').replace(/</g, '&lt;');
                        let content = `<div class="step-header"><div class="step-title">Step ${i+1}</div><div class="step-op">${opText}</div></div><div class="field-row">`;
                        for (let key of Object.keys(step)) {
                            if (['cycle', 'operation'].includes(key)) continue;
                            content += `<div><div class="field-name">${key}</div><div class="field-value">${step[key]}</div></div>`;
                        }
                        content += '</div>';
                        box.innerHTML = content;
                        s.appendChild(box);
                    });
                })
                .catch(() => {
                    alert('Server error');
                    document.getElementById('calcBtn').disabled = false;
                });
        }
    </script>
</body>

</html>
